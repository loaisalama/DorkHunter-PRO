name: Build DorkHunter PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Locate Project
        id: locate
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path './.git/*' | head -n 1)

          if [ -z "$WRAPPER" ] && [ -f "DorkHunterPRO-Android.zip" ]; then
            mkdir -p extracted
            unzip -q DorkHunterPRO-Android.zip -d extracted
            WRAPPER=$(find extracted -type f -name gradlew | head -n 1)
          fi

          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DorkHunter-PRO-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
