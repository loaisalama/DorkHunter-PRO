name: Build DorkHunter PRO APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK Licenses
    run: yes | sdkmanager --licenses || true

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract project
    run: |
      unzip -q DorkHunterPRO-Android.zip -d extracted

  - name: Build APK
    run: |
      cd extracted/DorkHunterPRO-Android
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: DorkHunter-PRO-APK
      path: extracted/DorkHunterPRO-Android/app/build/outputs/apk/debug/app-debug.apk
